<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StormShield</title>
  <meta name="description" content="Location-aware extreme weather preparedness: your risk, nearby hazards and what to do next.">
  <meta name="theme-color" content="#0f1a21">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/vendor/leaflet.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="app" id="app">
    <aside class="rail" aria-label="Main navigation">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true" class="brand-mark"><path d="M16 2 4 7v8c0 7 5.2 12.6 12 15 6.8-2.4 12-8 12-15V7L16 2z" fill="var(--accent)"/><path d="m17.5 8-6 9h4.5l-1.5 7 6.5-10h-4.5l1-6z" fill="var(--on-accent)"/></svg>
        <span class="brand-name">StormShield</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="rail-foot">
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch theme"></button>
      </div>
    </aside>

    <section class="panel" id="panel" aria-live="polite">
      <header class="panel-head">
        <div class="loc" id="locBar"></div>
        <button class="icon-btn" id="refreshBtn" type="button" aria-label="Refresh data" title="Refresh data"></button>
      </header>
      <div id="banners"></div>
      <div class="view" id="view" tabindex="-1"></div>
    </section>

    <main class="mapwrap" aria-label="Hazard map">
      <div id="map"></div>
      <div class="map-status" id="mapStatus"></div>
      <div class="map-tools">
        <button class="map-btn" id="recentreBtn" type="button" aria-label="Centre map on my location" title="Centre on me"></button>
        <button class="map-btn" id="layersBtn" type="button" aria-label="Map layers" title="Map layers"></button>
      </div>
      <div class="map-hint" id="mapHint" hidden></div>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  </div>

  <div class="onboard" id="onboard" hidden>
    <div class="onboard-card" role="dialog" aria-modal="true" aria-labelledby="obTitle">
      <h1 id="obTitle">Know where you are. Understand what threatens you. Know what to do next.</h1>
      <p id="obText">StormShield uses your location to check weather, warnings and resources around you. Your location stays in this browser unless you submit a community report.</p>
      <div class="ob-status" id="obStatus"></div>
      <div class="ob-actions">
        <button class="btn primary" id="obLocate" type="button">Use my location</button>
        <form class="search" id="obSearch" role="search">
          <label class="sr" for="obQuery">Search for a place</label>
          <input id="obQuery" type="search" placeholder="Or search a town, suburb or address" autocomplete="off">
          <button class="btn" type="submit">Search</button>
        </form>
        <ul class="results" id="obResults"></ul>
        <button class="btn ghost" id="obDemo" type="button">Explore with demonstration data</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/vendor/leaflet.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
